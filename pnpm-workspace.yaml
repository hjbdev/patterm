packages:
  - .

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest@*: 5.0.4

allowBuilds:
  electron: true
  esbuild: true
  vue-demi: true
  # Its postinstall only builds llama.cpp from source; the prebuilt
  # @node-llama-cpp/* packages already carry the CPU binaries.
  node-llama-cpp: false

# Permit this exact Vite+ release during pnpm's release-age delay.
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.2.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.2.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.2.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.2.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0'
  - vite-plus@1.2.0
  # EmbeddingGemma 2 (llama.cpp architecture gemma-embedding2) first loads in
  # this release; 3.22.1 rejects the model.
  - node-llama-cpp@3.22.2
  - '@node-llama-cpp/linux-x64@3.22.2'
  - '@node-llama-cpp/linux-arm64@3.22.2'
  - '@node-llama-cpp/mac-x64@3.22.2'
  - '@node-llama-cpp/mac-arm64-metal@3.22.2'
  - '@node-llama-cpp/win-x64@3.22.2'
  - '@node-llama-cpp/win-arm64@3.22.2'

# Semantic history search runs on the CPU only, so the GPU builds of
# node-llama-cpp (hundreds of MB each) are never installed or packaged.
ignoredOptionalDependencies:
  - '@node-llama-cpp/linux-x64-cuda'
  - '@node-llama-cpp/linux-x64-cuda-ext'
  - '@node-llama-cpp/linux-x64-vulkan'
  - '@node-llama-cpp/win-x64-cuda'
  - '@node-llama-cpp/win-x64-cuda-ext'
  - '@node-llama-cpp/win-x64-vulkan'
  - '@node-llama-cpp/linux-armv7l'
  - '@node-llama-cpp/linux-riscv64'
  # ipull, node-llama-cpp's CLI downloader, tries it for copy-on-write file
  # clones and falls back without it. It ships a native binary with no
  # licence text, and Patterm never uses that downloader.
  - '@reflink/reflink'
