name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # remoteAccessSmoke, in check, runs the installer, which needs the server build.
      - run: pnpm run build:server
      - run: pnpm run check
      - run: node --test tests/serviceInstallerSmoke.mjs
