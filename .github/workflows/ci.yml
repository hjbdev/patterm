name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - uses: ./.github/actions/cache-rust
        with:
          variant: check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # remoteAccessSmoke, in check, runs the installer, which needs the server build.
      - name: Build the server using the existing renderer and MCP shim
        run: pnpm exec tsc -p tsconfig.server.json && pnpm run build:sidecar:release
      - uses: ./.github/actions/cache-typecheck
      - run: pnpm run check:ci

  check-windows:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the Windows installer
        shell: powershell
        run: ./tests/windowsInstallerSmoke.ps1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - uses: ./.github/actions/cache-rust
        with:
          variant: check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Linux-only checks (systemd units, the bash installer and launchers) skip themselves on win32.
      - uses: ./.github/actions/cache-typecheck
      - run: pnpm run check:ci

  build-windows:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/cache-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sidecar:release
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm run build:renderer
          pnpm run build:mcp
      # A portable zip for testing each change on Windows; releases attach the same build.
      - name: Package
        run: |
          $version = "$((Get-Content package.json -Raw | ConvertFrom-Json).version)-ci.${{ github.run_number }}"
          node scripts/release/package-windows.mjs --version $version --sidecar native/terminal-core/target/release/patterm-terminal-core.exe --out "${{ runner.temp }}/release"
      - name: Install the built Windows package in an isolated directory
        shell: powershell
        run: ./tests/windowsInstallerSmoke.ps1 -PackageDirectory "$env:RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}/release/patterm-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-macos:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Intel macOS has no standalone pnpm v11 binary; install Node first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      # The pnpm action's self-update also selects a missing Intel native binary.
      - name: Install the pinned pnpm version through npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/cache-rust
      - name: Build and test the sidecar
        run: |
          cargo build --release --locked --manifest-path native/terminal-core/Cargo.toml
          cargo test --release --locked --manifest-path native/terminal-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm run build:renderer
          pnpm run build:mcp
      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")-ci.${{ github.run_number }}"
          node scripts/release/package-macos.mjs --version "$version" --sidecar native/terminal-core/target/release/patterm-terminal-core --out "$RUNNER_TEMP/release"
      - name: Test the packaged Mac app
        env:
          MAC_PACKAGE_DIRECTORY: ${{ runner.temp }}/release
        run: node --test tests/macInstallerSmoke.mjs tests/macPackageSmoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/patterm-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
