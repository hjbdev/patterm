name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-windows:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec tsc -p tsconfig.tests.json
      - name: Run the Codex smoke under load
        shell: bash
        run: |
          fails=0
          for round in 1 2 3 4 5; do
            pids=()
            for copy in 1 2 3 4; do
              ( start=$(date +%s); if node dist/tests/tests/codexAppServerSmoke.js > run-$copy.log 2>&1; then r=pass; else r=FAIL; fi; echo "$r $(( $(date +%s) - start ))s" > result-$copy ) &
              pids+=($!)
            done
            wait "${pids[@]}"
            for copy in 1 2 3 4; do
              r=$(cat result-$copy); echo "=== round $round copy $copy: $r"
              case "$r" in FAIL*) fails=$((fails+1));; esac
              grep -E "\[probe\]|processes still|^[0-9]+ parent=|EPERM|EBUSY|AssertionError|Error:" run-$copy.log | head -40 || true
            done
          done
          echo "failures: $fails"
