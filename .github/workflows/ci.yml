name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-windows:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec tsc -p tsconfig.tests.json
      - name: Run the Codex smoke repeatedly
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 8); do
            start=$(date +%s)
            if node dist/tests/tests/codexAppServerSmoke.js > run.log 2>&1; then r=pass; else r=FAIL; fails=$((fails+1)); fi
            echo "=== run $i: $r in $(( $(date +%s) - start ))s"
            grep -E "\[probe\]|processes still|^[0-9]+ parent=|EPERM|EBUSY|AssertionError|Error:" run.log | head -40 || true
          done
          echo "failures: $fails"
