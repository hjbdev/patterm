name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # remoteAccessSmoke, in check, runs the installer, which needs the server build.
      - run: pnpm run build:server
      - run: pnpm run check
      - run: node --test tests/serviceInstallerSmoke.mjs

  check-windows:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Linux-only checks (systemd units, the bash installer and launchers) skip themselves on win32.
      - run: pnpm run check

  build-windows:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:sidecar:release
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm run build:renderer
          pnpm run build:mcp
      # A portable zip for testing each change on Windows; releases attach the same build.
      - name: Package
        run: |
          $version = "$((Get-Content package.json -Raw | ConvertFrom-Json).version)-ci.${{ github.run_number }}"
          node scripts/release/package-windows.mjs --version $version --sidecar native/terminal-core/target/release/patterm-terminal-core.exe --out "${{ runner.temp }}/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}/release/patterm-*
          if-no-files-found: error
          retention-days: 7
