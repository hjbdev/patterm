name: Release

# Tags publish Linux packages, a portable Windows zip, and macOS app zips.
# A suffix marks a prerelease.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # Gitea Actions also runs .github/workflows; its mirror must not.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$GITHUB_REF_NAME is not a semantic version tag"; exit 1; }
          test -s scripts/release/minisign.pub || { echo '::error::scripts/release/minisign.pub is missing'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo '::error::Release tags must point at a commit on main'; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure git for tests that commit
        run: |
          git config --global user.name 'Patterm CI'
          git config --global user.email 'ci@invalid'
          git config --global init.defaultBranch main
      - uses: ./.github/actions/cache-rust
        with:
          variant: check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # remoteAccessSmoke, in check, runs the installer, which needs the server build.
      - name: Build the server using the existing renderer and MCP shim
        run: pnpm exec tsc -p tsconfig.server.json && pnpm run build:sidecar:release
      - uses: ./.github/actions/cache-typecheck
      - run: pnpm run check:ci

  build:
    if: github.server_url == 'https://github.com'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build the static sidecar
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - uses: ./.github/actions/cache-rust
        with:
          target: ${{ matrix.target }}
      - name: Build and test the static sidecar
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --manifest-path native/terminal-core/Cargo.toml
          cargo test --release --locked --target ${{ matrix.target }} --manifest-path native/terminal-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm exec tsc -p tsconfig.server.json
          pnpm run build:renderer
          pnpm run build:mcp
      - name: Package
        run: scripts/release/package.sh --version "${GITHUB_REF_NAME#v}" --arch ${{ matrix.arch }} --sidecar native/terminal-core/target/${{ matrix.target }}/release/patterm-terminal-core --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/patterm-*
            ${{ runner.temp }}/release/install.sh
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows:
    # Portable Windows packages stay outside the Linux installer manifest.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/cache-rust
      - name: Build the sidecar
        run: |
          cargo build --release --locked --manifest-path native/terminal-core/Cargo.toml
          cargo test --release --locked --manifest-path native/terminal-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm run build:renderer
          pnpm run build:mcp
      - name: Package
        run: node scripts/release/package-windows.mjs --version $("$env:GITHUB_REF_NAME".Substring(1)) --sidecar native/terminal-core/target/release/patterm-terminal-core.exe --out "${{ runner.temp }}/release"
      - name: Test the Windows installer with the built package
        shell: powershell
        run: ./tests/windowsInstallerSmoke.ps1 -PackageDirectory "$env:RUNNER_TEMP/release" -CheckStartRegistration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}/release/patterm-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-macos:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Intel macOS has no standalone pnpm v11 binary; install Node first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      # The pnpm action's self-update also selects a missing Intel native binary.
      - name: Install the pinned pnpm version through npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/cache-rust
      - name: Build and test the sidecar
        run: |
          cargo build --release --locked --manifest-path native/terminal-core/Cargo.toml
          cargo test --release --locked --manifest-path native/terminal-core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - name: Build the application
        run: |
          pnpm run build:main
          pnpm run build:renderer
          pnpm run build:mcp
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/package-macos.mjs --version "$version" --sidecar native/terminal-core/target/release/patterm-terminal-core --out "$RUNNER_TEMP/release"
      - name: Test the packaged Mac app
        env:
          MAC_PACKAGE_DIRECTORY: ${{ runner.temp }}/release
        run: node --test tests/macInstallerSmoke.mjs tests/macPackageSmoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/patterm-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [check, build, build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write and sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release/manifest.mjs "$version" "$GITHUB_SHA" release/*.tar.gz.sha256 release/*.zip.sha256 > release/manifest.json
          sudo apt-get update
          sudo apt-get install -y minisign
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m release/manifest.json -t "patterm $version"
          # Check the signature with the key installs trust before publishing it.
          node scripts/release/verify-minisign.mjs "$(tail -n 1 scripts/release/minisign.pub)" release/manifest.json release/manifest.json.minisig
      - name: Prepare the installer scripts
        run: |
          # Both architectures render the same install.sh as the one in their tarballs.
          cp scripts/release/uninstall.sh release/uninstall.sh
          cp scripts/release/install.ps1 release/install.ps1
          cp scripts/release/install-macos.sh release/install-macos.sh
          if grep -n '@PATTERM_REPO@\|@MINISIGN_PUBLIC_KEY@' release/install.sh; then exit 1; fi
          (cd release && sha256sum install.sh uninstall.sh install.ps1 install-macos.sh > scripts.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          # Stable releases and prereleases carry Windows and macOS zips.
          shopt -s nullglob
          desktop=(release/*.zip release/*.zip.sha256)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file scripts/release/notes.md --title "Patterm ${GITHUB_REF_NAME#v}" "${prerelease[@]}" \
            release/*.tar.gz release/*.tar.gz.sha256 release/manifest.json release/manifest.json.minisig release/install.sh release/install.ps1 release/install-macos.sh release/uninstall.sh release/scripts.sha256 "${desktop[@]}"
