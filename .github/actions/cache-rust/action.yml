name: Cache Rust builds
description: Reuse Cargo downloads and sidecar builds for the same runner and toolchain.
inputs:
  variant:
    description: Separate debug checks from release packaging caches.
    default: release
  target:
    description: Native or an explicit Rust target triple.
    default: native
runs:
  using: composite
  steps:
    - name: Identify the Rust toolchain
      id: toolchain
      shell: bash
      run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          native/terminal-core/target
        # Cargo validates restored artifacts; keep OS, architecture, target and
        # toolchain separate, and save fresh builds when sidecar sources change.
        key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.variant }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('native/terminal-core/Cargo.lock', 'native/terminal-core/Cargo.toml') }}-${{ hashFiles('native/terminal-core/src/**') }}
        restore-keys: |
          rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.variant }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('native/terminal-core/Cargo.lock', 'native/terminal-core/Cargo.toml') }}-
