name: Cache TypeScript type checks
description: Restore compiler state; TypeScript validates file contents before reusing it.
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        # No emitted JavaScript is cached: builds and tests always produce their
        # current outputs. These projects only run with --noEmit.
        path: dist/typecheck
        key: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-${{ github.sha }}
        restore-keys: |
          typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-
