[package]
name = "patterm-terminal-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.95"
# Already in the tree through alacritty_terminal; used by the notification scanner.
memchr = "2.8.1"
polling = "3.11.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
